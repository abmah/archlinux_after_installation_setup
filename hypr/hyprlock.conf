# Windows XP "Welcome" lock screen for hyprlock.
# All right-pane elements share one anchor point so they line up as a group.
#
# Coordinate model used here:
#   halign = center   →  position.x is offset from screen H-center (positive = right)
#   valign = center   →  position.y is offset from screen V-center (positive = UP)

general {
    grace = 0
    hide_cursor = false
    no_fade_in = false
    disable_loading_bar = true
}

background {
    monitor =
    path = /home/abd/.config/hypr/xp-login-bg.png
    blur_passes = 0
}

# ─── Left-pane: "Welcome" header ─────────────────────────────────────────

label {
    monitor =
    text = Welcome
    color = rgba(FFFFFFFF)
    font_size = 78
    font_family = Trebuchet MS Italic
    halign = left
    valign = center
    position = 80, 120
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000088)
}

label {
    monitor =
    text = To begin, click your user name.
    color = rgba(FFFFFFEE)
    font_size = 16
    font_family = Tahoma
    halign = left
    valign = center
    position = 90, 60
}

# ─── Vertical center separator ───────────────────────────────────────────

shape {
    monitor =
    size = 2, 540
    color = rgba(FFFFFFB0)
    rounding = 0
    border_size = 0
    halign = center
    valign = center
    position = 0, 0
}

# ─── Right-pane: user picker ─────────────────────────────────────────────
# Anchor: screen H-center + 320 px (right of separator), V-center
# Origin point of the user panel is treated as the LEFT-EDGE of the tile.
# Tile box: 120x120
# Username sits to the right of tile, roughly tile-vertical-center
# "Type your password" hint is below the tile-right area
# Password field is BELOW the tile, full-width (~310px)
# Green arrow + ? are right of the password field on the same row

# 1. User tile (120x120)
image {
    monitor =
    path = /home/abd/.config/hypr/xp-user-tile.png
    size = 120
    border_size = 2
    border_color = rgba(FFFFFFFF)
    rounding = 4
    halign = center
    valign = center
    position = 380, 60
}

# 2. Username — right of the tile, vertically centered with tile-top half
label {
    monitor =
    text = $USER
    color = rgba(FFFFFFFF)
    font_size = 26
    font_family = Tahoma Bold
    halign = center
    valign = center
    position = 565, 90
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
}

# 3. "Type your password" small hint — under the username, still right of tile
label {
    monitor =
    text = Type your password
    color = rgba(FFFFFFEE)
    font_size = 12
    font_family = Tahoma
    halign = center
    valign = center
    position = 565, 50
}

# 4. Password input — directly under the tile, LEFT-aligned with tile-left,
#    extending rightward past the username so it spans the user-panel width.
#    Tile spans  (center + 320) → (center + 440)  (size 120, position 380)
#    Input spans (center + 320) → (center + 640)  (size 320, center @ 480)
input-field {
    monitor =
    size = 320, 34
    outline_thickness = 1
    dots_size = 0.32
    dots_spacing = 0.30
    dots_center = true
    inner_color = rgba(FFFFFFFF)
    outer_color = rgba(0A246AFF)
    font_color = rgba(000000FF)
    font_family = Tahoma
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 3
    check_color = rgba(316AC5FF)
    fail_color = rgba(C0392BFF)
    halign = center
    valign = center
    position = 480, -30
}

# 5. Green ENTER arrow — right of password field
image {
    monitor =
    path = /home/abd/.config/hypr/xp-arrow.png
    size = 34
    rounding = -1
    halign = center
    valign = center
    position = 660, -30
}

# 6. ? help hint — right of the arrow
label {
    monitor =
    text = ?
    color = rgba(FFFFFFCC)
    font_size = 16
    font_family = Tahoma Bold
    halign = center
    valign = center
    position = 700, -30
}

# ─── Bottom edge ─────────────────────────────────────────────────────────

label {
    monitor =
    text = After you log on, you can add or change accounts. Just go to Control Panel and click User Accounts.
    color = rgba(FFFFFFAA)
    font_size = 11
    font_family = Tahoma
    halign = left
    valign = bottom
    position = 40, 24
}

label {
    monitor =
    text = $TIME
    color = rgba(FFFFFFFF)
    font_size = 24
    font_family = Tahoma Bold
    halign = right
    valign = bottom
    position = -40, 60
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(00000088)
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %B %-d'
    color = rgba(FFFFFFEE)
    font_size = 13
    font_family = Tahoma
    halign = right
    valign = bottom
    position = -40, 32
}
