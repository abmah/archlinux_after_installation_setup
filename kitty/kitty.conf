# Frutiger Aero kitty

font_family      JetBrainsMono Nerd Font Propo
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0

initial_window_width  900
initial_window_height 620
window_padding_width  0
window_border_width   0
draw_minimal_borders  yes
placement_strategy    top-left
resize_in_steps       no

# --- Frutiger Aero background ---
background_image            /home/abd/.config/kitty/aero-bg.png
background_image_layout     scaled
background_image_linear     yes
background_tint             0.45
background_tint_gaps        0.0
background_opacity          0.88
background_blur             8
dynamic_background_opacity  yes

# --- Tabs (XP-cyan with bright active tab) ---
tab_bar_edge       top
tab_bar_style      separator
tab_separator      " "
tab_title_template " {title.upper()} "
active_tab_font_style bold
tab_bar_min_tabs   2

active_tab_foreground   #ffffff
active_tab_background   #1ea7ff
inactive_tab_foreground #e6f3ff
inactive_tab_background #0d63b8
tab_bar_background      #0a4998

# --- Foreground / cursor / selection ---
foreground           #ffffff
background           #0c5fb4
selection_foreground #082555
selection_background #c6f25e

cursor               #ffffff
cursor_text_color    #0a4998
cursor_shape         block
cursor_blink_interval 0.6
cursor_trail         3
cursor_trail_decay   0.10 0.40

# --- 16-color palette (XP/aero brights) ---
color0  #2156a0
color8  #d2e8ff
color1  #ff7878
color9  #ffa1a1
color2  #9bef5a
color10 #c6f25e
color3  #ffe066
color11 #fff2a8
color4  #5fb8ff
color12 #a8dcff
color5  #d77bff
color13 #f0a8ff
color6  #6ff0ff
color14 #c8faff
color7  #ffffff
color15 #ffffff

# --- Window borders ---
active_border_color   #c6f25e
inactive_border_color #1ea7ff

# --- Misc ---
scrollback_lines     10000
mouse_hide_wait      3.0
url_color            #c6f25e
url_style            curly
repaint_delay        10
input_delay          3
sync_to_monitor      yes
enable_audio_bell    no
visual_bell_duration 0.0
enabled_layouts      *
window_resize_step_cells 2
window_resize_step_lines 2
allow_remote_control no
clipboard_control    write-clipboard write-primary
term                 xterm-256color
